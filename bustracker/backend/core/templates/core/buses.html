{% extends "core/base.html" %}
{% load static %}
{% block title %}Buses{% endblock %}
{% block page_title %}Manage Buses{% endblock %}
{% block content %}
<div class="panel-header">
  <h2>Buses</h2>
  <div class="panel-actions" id="buses-actions"></div>
</div>
<div id="buses-table-container"></div>

<div id="add-bus-form" class="form-card hidden">
  <h3>Add New Bus</h3>
  <div class="form-row">
    <div class="form-group"><label>Bus Number</label><input type="text" id="new-bus-num" class="form-input" placeholder="e.g. KL-07-1234"></div>
    <div class="form-group"><label>Registration No.</label><input type="text" id="new-bus-reg" class="form-input" placeholder="Registration number"></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Capacity</label><input type="number" id="new-bus-cap" class="form-input" value="50"></div>
    <div class="form-group"><label>Model</label><input type="text" id="new-bus-model" class="form-input" placeholder="Bus model"></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Assign Route</label><select id="new-bus-route" class="form-input"><option value="">Select route</option></select></div>
    <div class="form-group"><label>Assign Driver</label><select id="new-bus-driver" class="form-input"><option value="">Select driver</option></select></div>
  </div>
  <div class="form-actions">
    <button class="btn-outline" onclick="document.getElementById('add-bus-form').classList.add('hidden')">Cancel</button>
    <button class="btn-primary" onclick="createBus()">Add Bus</button>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{% static 'js/buses.js' %}"></script>
{% endblock %}
